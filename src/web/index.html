<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>billy</title>
<style>
  :root {
    --bg: #14151a; --panel: #1b1d24; --line: #2a2d37;
    --text: #d7dae0; --dim: #8b90a0; --accent: #7aa2f7;
    --add: #9ece6a; --del: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* `--app-height` is the visible area, set from the visual viewport so that an
       on-screen keyboard shrinks the app rather than covering the prompt box.
       `dvh` is the fallback for a browser with no visual viewport, and it also
       covers the address bar. `overflow: hidden` keeps the page from scrolling as
       a whole, the conversation scrolls instead. */
    height: var(--app-height, 100dvh); overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* The button that opens the session list on a narrow screen. It is hidden
     where the sidebar is always shown. */
  #topbar { display: flex; align-items: center; flex: none; }
  #menu {
    display: none; flex: none; align-items: center; justify-content: center;
    width: 44px; height: 40px; margin-left: 4px; padding: 0;
    background: none; border: none; color: var(--text); font: inherit;
    font-size: 18px; cursor: pointer;
  }

  /* The list of sessions down the left, and the button that starts a new one. */
  #sidebar {
    width: 250px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  /* Dims the page behind the session list when it is open over it. */
  #backdrop {
    display: none; position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, 0.5);
  }
  #sidebar header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
  }
  #sidebar h1 { margin: 0; font-size: 14px; font-weight: 600; }
  #new {
    background: none; border: 1px solid var(--line); color: var(--accent);
    border-radius: 6px; width: 26px; height: 26px; line-height: 1;
    font: inherit; font-size: 17px; cursor: pointer;
  }
  #new:hover { border-color: var(--accent); }
  #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #list li {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--dim);
    overflow: hidden;
  }
  #list li:hover { background: #22242c; color: var(--text); }
  #list li.selected { background: #262a35; color: var(--text); }
  /* A session is shown by its title, with the id it can be resumed by under it
     in a smaller, dimmer line. A session that has not been named shows its id
     alone, in the place of the title. */
  #list li .title {
    color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #list li .ident {
    color: #5f6675; font-size: 11px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  #list li:not(.selected):hover .ident { color: var(--dim); }
  #list .empty { color: var(--dim); cursor: default; padding: 6px 8px; }
  #list .empty:hover { background: none; }

  /* The conversation in the middle, with the prompt box under it. */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header {
    flex: 1; min-width: 0;
    padding: 7px 16px; border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  #header:empty { display: none; }
  #header .sep { color: #3a3f4b; }
  #header .id { color: #6f7688; }
  #conversation { flex: 1; overflow-y: auto; padding: 16px; }
  #prompt { display: flex; padding: 12px 16px; border-top: 1px solid var(--line); }
  #text {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit;
    /* A prompt is a textarea so a newline can be typed into it. It starts one
       line tall and grows with what is written, up to a share of the window,
       after which it scrolls. */
    resize: none; overflow-y: auto; min-height: 0; max-height: 40vh;
  }
  #text:disabled { color: var(--dim); }
  /* The mode picker beside the prompt box. It is only for a session that has not
     been asked anything yet, so it is disabled once one has a conversation. */
  #mode {
    flex: none; align-self: flex-end; margin-left: 8px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  #mode:disabled { color: var(--dim); cursor: default; }

  /* A prompt or a reply: a headed block of markdown. */
  .block { margin-bottom: 16px; }
  .block .head { color: var(--dim); font-size: 12px; margin-bottom: 5px; }
  .block .head .name { color: var(--text); font-weight: 600; }
  .block.prompt .head .glyph { color: var(--accent); }
  .block.answer .head .glyph { color: var(--add); }
  .block :first-child { margin-top: 0; }
  .block p { margin: 0 0 8px; }
  .block ul, .block ol { margin: 0 0 8px; padding-left: 22px; }
  .block h1, .block h2, .block h3, .block h4, .block h5, .block h6 { font-size: 15px; margin: 12px 0 6px; }
  /* A link, a table and an image are what a CommonMark renderer writes that the
     blocks above do not already cover. */
  .block a { color: var(--accent); }
  .block img { max-width: 100%; }
  .block table { border-collapse: collapse; margin: 0 0 8px; }
  .block th, .block td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  .block th { background: var(--panel); }
  .block blockquote {
    margin: 0 0 8px; padding-left: 10px; border-left: 2px solid var(--line);
    color: var(--dim);
  }
  .block hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }

  /* Code: inline, in a block of markdown, and as a tool's own output. */
  code {
    background: #22242c; border-radius: 3px; padding: 1px 4px; font: inherit;
  }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; overflow-x: auto; margin: 0 0 8px;
  }
  pre code { background: none; padding: 0; }
  pre.error { color: var(--del); }

  /* A tool call: a headed summary that opens onto what the call ran and what it
     produced, collapsed by default so a long conversation stays readable. */
  details.tool { margin-bottom: 16px; }
  summary.tool-head {
    color: var(--dim); font-size: 12px; cursor: pointer; list-style: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    /* One line, so a call stays a single compact row; a long description is cut
       off with an ellipsis rather than wrapping. */
    white-space: nowrap; overflow: hidden;
  }
  summary.tool-head::-webkit-details-marker { display: none; }
  summary.tool-head:hover .name { text-decoration: underline; }
  /* The disclosure marker: a chevron that turns to point down once the call is
     open. It is a chevron rather than a triangle so it is not mistaken for the
     glyph of a `read`, which is a triangle too. */
  summary.tool-head::before { content: '›'; color: #3a3f4b; flex: none; }
  details.tool[open] summary.tool-head::before { transform: rotate(90deg); }
  .tool-head .name { color: var(--text); font-weight: 600; flex: none; }
  .tool-head .target { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* The exit status: a fixed-width pill between the tool's name and what it acted
     on, so a status is always in the same place and the description after it
     always lines up. Grey with an ellipsis while the call runs; the colour of the
     exit and the code once it has one; grey and empty for a finished call whose
     status was never recorded. */
  .tool-head .exit {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 4.5em; height: 18px; padding: 0 6px; border-radius: 9px;
    font-size: 11px; line-height: 1; border: 1px solid transparent;
    font-variant-numeric: tabular-nums; overflow: hidden;
  }
  .tool-head .exit.ok { color: var(--add); border-color: rgba(158, 206, 106, 0.45); background: rgba(158, 206, 106, 0.10); }
  .tool-head .exit.failed { color: var(--del); border-color: rgba(247, 118, 142, 0.5); background: rgba(247, 118, 142, 0.12); }
  .tool-head .exit.running, .tool-head .exit.unknown { color: var(--dim); border-color: var(--line); background: rgba(255, 255, 255, 0.03); }
  .tool-head .glyph { color: var(--dim); }
  .tool-head .glyph.hue-blue { color: var(--accent); }
  .tool-head .glyph.hue-green { color: var(--add); }
  .tool-head .glyph.hue-yellow { color: #e0af68; }
  .tool-head .glyph.hue-cyan { color: #7dcfff; }
  .tool-head .glyph.hue-magenta { color: #bb9af7; }
  .tool-head .glyph.hue-red { color: var(--del); }
  /* The body is indented under the summary, and its last piece does not add a
     gap of its own. */
  .tool-body { margin: 5px 0 0 14px; }
  .tool-body > :last-child { margin-bottom: 0; }

  /* The favicon bubbles of a web search: one small round bubble per source, on
     its own row under the head. They are in the summary, so which sources were
     found shows whether the call is open or collapsed. Each holds the source's
     own favicon, cropped to fill the circle, and opens it. */
  .tool-head .favs {
    flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 5px; margin-left: 14px;
  }
  .fav {
    position: relative; width: 16px; height: 16px; border-radius: 50%; flex: none;
    display: block; overflow: hidden; background: var(--line); text-decoration: none;
  }
  /* The letter sits behind the icon, so a source with no favicon still reads as a
     small bubble with its initial rather than a broken image: the icon covers it
     when it loads, and removes itself when it does not. */
  .fav .letter {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 9px; font-weight: 600; text-transform: uppercase; line-height: 1;
  }
  .fav img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .fav:hover img { filter: brightness(1.3); }
  .fav:hover .letter { color: var(--text); }
  pre.diff .removed { color: var(--del); }
  pre.diff .added { color: var(--add); }
  pre.diff .context, pre.diff .elided { color: var(--dim); }

  /* The lines billy writes itself, and what the page adds of its own. */
  .compacted, .notice, .elided {
    color: var(--dim); font-size: 12px; margin-bottom: 16px;
  }
  .failed { color: var(--del); }
  #prompt.working #text { color: var(--dim); }
  #prompt.working #mode { color: var(--dim); }

  /* A narrow screen: the conversation takes the whole width and the session list
     is a drawer over it, opened by the menu button. Tap targets grow and the
     prompt box is 16px, which is the size a phone will not zoom in on when it is
     focused. */
  @media (max-width: 720px) {
    #menu { display: flex; }
    #sidebar {
      position: fixed; top: 0; left: 0; z-index: 10; height: var(--app-height, 100dvh);
      width: min(80vw, 300px);
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    body.drawer #sidebar { transform: translateX(0); }
    body.drawer #backdrop { display: block; }
    #new { width: 34px; height: 34px; font-size: 20px; }
    #list { padding: 8px; }
    #list li { padding: 10px 10px; }
    #header { padding: 8px 12px; }
    #conversation { padding: 12px; }
    #prompt { padding: 10px; }
    #text, #mode { font-size: 16px; }
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>billy</h1>
      <button id="new" title="new session">&plus;</button>
    </header>
    <ul id="list"></ul>
  </aside>

  <main>
    <div id="topbar">
      <button id="menu" title="sessions">&#9776;</button>
      <div id="header"></div>
    </div>
    <div id="conversation"></div>
    <form id="prompt">
      <textarea id="text" rows="1" placeholder="ask billy something (shift+enter for a newline)" autocomplete="off"></textarea>
      <select id="mode" title="what a new session may do">
        <option value="ask">ask</option>
        <option value="general">general</option>
      </select>
    </form>
  </main>
  <div id="backdrop"></div>

<script>
// The page is a shell: every block of a conversation is rendered by the server
// and put in whole, so nothing here lays out an answer or escapes a file.
const list = document.getElementById('list');
const headerBox = document.getElementById('header');
const conversation = document.getElementById('conversation');
const form = document.getElementById('prompt');
const input = document.getElementById('text');
const modeSelect = document.getElementById('mode');
const menuButton = document.getElementById('menu');
const backdrop = document.getElementById('backdrop');
let selected = null;
let working = false;
// The tool call the turn is in the middle of: the `<details>` opened by a
// `tool_begin` event, whose body the `tool_end` event fills in. Null when no
// call is open.
let openCall = null;

// The sessions are listed again when a new one is started and when a turn ends,
// since which session was written to last is what orders them. The list is
// returned, or null when it could not be read, so a caller can tell an empty
// list from a server it could not reach.
async function refresh(select) {
  let sessions;
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) throw new Error('the server answered ' + res.status);
    sessions = (await res.json()).sessions;
  } catch (err) {
    // The list is left as it was rather than wiped, so a hiccup does not empty
    // what is on screen.
    console.error('could not list the sessions:', err);
    return null;
  }
  list.replaceChildren();
  if (sessions.length === 0) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = 'no sessions';
    list.append(empty);
    return sessions;
  }
  for (const session of sessions) {
    const item = document.createElement('li');
    item.dataset.id = session.id;
    setListedName(item, session.title);
    if (session.id === select) item.classList.add('selected');
    item.onclick = () => open(session.id);
    list.append(item);
  }
  return sessions;
}

// Shows a session's name in its list item: the title, with the id it can be
// resumed by under it in a smaller, dimmer line. A session that has not been
// named shows its id in the title's place. Every value is set as text, since an
// id or a title could be anything.
function setListedName(item, title) {
  item.replaceChildren();
  const name = document.createElement('div');
  name.className = 'title';
  name.textContent = title || item.dataset.id;
  item.append(name);
  if (title) {
    const ident = document.createElement('div');
    ident.className = 'ident';
    ident.textContent = item.dataset.id;
    item.append(ident);
  }
}

// Opens a session: the header above the conversation, and the conversation
// itself, both of which the server rendered.
async function open(id) {
  // Switching sessions while a turn is streaming would clear the conversation
  // the turn is still appending to, so it waits for the turn to end.
  if (working) return;
  let body;
  try {
    const res = await fetch('/api/sessions/' + encodeURIComponent(id));
    if (!res.ok) {
      note('could not open the session (' + res.status + ')');
      return;
    }
    body = await res.json();
  } catch (err) {
    note('lost the connection: ' + err.message);
    return;
  }
  selected = id;
  for (const item of list.children) item.classList.toggle('selected', item.dataset.id === id);
  closeDrawer();
  headerBox.innerHTML = body.header;
  conversation.innerHTML = body.blocks;
  // The mode is only chosen for a session that has no conversation yet, so it is
  // shown read-only once there is one.
  modeSelect.value = body.mode;
  modeSelect.disabled = body.blocks.trim() !== '';
  // Whatever the old conversation had open is gone with it.
  openCall = null;
  scrollToEnd();
  input.focus();
}

// Sends what was typed and shows the answer as it arrives. The whole exchange is
// one request: the server streams each block of it back as it is finished.
async function send(text) {
  if (working || text.trim() === '') return;
  // A session with no id yet is a new one: its first message creates it.
  const creating = selected === null;
  working = true;
  form.classList.add('working');
  input.disabled = true;
  // A turn makes the session one that has been asked something, so the mode is
  // fixed from here on.
  modeSelect.disabled = true;
  input.value = '';
  grow();

  try {
    const url = creating ? '/api/sessions' : '/api/sessions/' + encodeURIComponent(selected) + '/message';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: text, mode: modeSelect.value }),
    });
    if (res.status === 409) note('the session is busy; wait for the answer');
    else if (!res.ok) note('the prompt was refused (' + res.status + ')');
    else await readStream(res);
  } catch (err) {
    note('lost the connection: ' + err.message);
  } finally {
    working = false;
    // A turn that ended mid-call leaves nothing to fill in.
    openCall = null;
    form.classList.remove('working');
    input.disabled = false;
    input.focus();
    // The turn wrote to the session, so it is now the most recent one.
    refresh(selected);
  }
}

// Reads the event stream: frames are separated by a blank line, and each is a
// name and a line of JSON data.
async function readStream(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let end;
    while ((end = buffer.indexOf('\n\n')) >= 0) {
      handleFrame(buffer.slice(0, end));
      buffer = buffer.slice(end + 2);
    }
  }
  // Whatever is left could not be a whole frame, but show it rather than lose it.
  if (buffer.trim() !== '') handleFrame(buffer);
}

function handleFrame(frame) {
  let event = 'message';
  let data = '';
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (data === '') return;
  if (event === 'block') {
    // The block is the server's HTML, which is what it is for.
    conversation.insertAdjacentHTML('beforeend', JSON.parse(data).html);
    scrollToEnd();
  } else if (event === 'tool_begin') {
    // The whole call, collapsed, while it runs: its body is empty and its exit
    // status is not known yet.
    conversation.insertAdjacentHTML('beforeend', JSON.parse(data).html);
    openCall = conversation.lastElementChild;
    scrollToEnd();
  } else if (event === 'tool_end') {
    // The whole call again, now with its body and its exit status. It replaces
    // the one on screen, which keeps its place in the conversation and whether
    // the user had opened it.
    conversation.insertAdjacentHTML('beforeend', JSON.parse(data).html);
    const finished = conversation.lastElementChild;
    if (openCall) {
      finished.open = openCall.open;
      conversation.replaceChild(finished, openCall);
    }
    openCall = null;
    scrollToEnd();
  } else if (event === 'session') {
    // The first message created a session; its id is here, so the page adds it
    // to the list and marks it as the one being asked.
    selected = JSON.parse(data).id;
    refresh(selected);
  } else if (event === 'header') {
    headerBox.innerHTML = JSON.parse(data).html;
  } else if (event === 'title') {
    // The session being asked was just named; its list item is updated in place,
    // rather than the whole list asked for again, since the name is here.
    const title = JSON.parse(data).title;
    for (const item of list.children) {
      if (item.dataset.id === selected) setListedName(item, title);
    }
  } else if (event === 'error') {
    note(JSON.parse(data).message);
  }
}

// A line the page writes itself, such as why a turn did not happen. The text is
// set as text, since it is not the server's HTML.
function note(text) {
  const line = document.createElement('div');
  line.className = 'notice failed';
  line.textContent = text;
  conversation.append(line);
  scrollToEnd();
}

function scrollToEnd() {
  conversation.scrollTop = conversation.scrollHeight;
}

// The session list is a drawer on a narrow screen: the menu button opens it and
// the backdrop or a chosen session closes it. On a wide screen it is always
// shown, so opening it is a no-op there.
function closeDrawer() {
  document.body.classList.remove('drawer');
}
menuButton.onclick = () => document.body.classList.toggle('drawer');
backdrop.onclick = closeDrawer;

// Sizes the app to the part of the screen the user can actually see. An
// on-screen keyboard does not shrink `dvh`, so without this the prompt box sits
// behind the keyboard; the visual viewport is the rectangle above it. `scrollTo`
// undoes the pan iOS does to reveal the focused box, so the layout stays put.
function fitViewport() {
  const view = window.visualViewport;
  if (!view) return;
  document.documentElement.style.setProperty('--app-height', view.height + 'px');
  window.scrollTo(0, 0);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
  fitViewport();
}

form.onsubmit = (event) => {
  event.preventDefault();
  send(input.value);
  return false;
};

// A prompt box is a textarea, so a newline can be typed into it. It is one line
// tall to begin with and grows to fit what is written, up to the height the
// stylesheet caps it at; past that it scrolls.
function grow() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}
input.addEventListener('input', grow);
input.addEventListener('keydown', (event) => {
  // Enter sends, the way it does in a chat box. Shift+Enter is the newline, so a
  // prompt can still be written over several lines; every other key is left to
  // the textarea.
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

// Clears the view to a session that has not been asked anything: no id, an empty
// conversation, and the mode picker ready. Nothing is created on the server until
// the first message is sent.
function newDraft() {
  if (working) return;
  selected = null;
  openCall = null;
  headerBox.innerHTML = '';
  conversation.innerHTML = '';
  modeSelect.value = 'ask';
  modeSelect.disabled = false;
  input.value = '';
  grow();
  for (const item of list.children) item.classList.remove('selected');
  closeDrawer();
  input.focus();
}

document.getElementById('new').onclick = newDraft;

// The page opens on a fresh session, so there is nothing to pick before asking
// something. The list is still read, so it is there behind the menu.
(async () => {
  const sessions = await refresh();
  if (sessions === null) note('could not reach the server');
  newDraft();
})();
</script>
</body>
</html>
